<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Study Site">
<title>English Study Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --bg:#111317; --card:#1b1e24; --text:#f1f3f5; --muted:#9aa1ad; --accent:#3b82f6; --off:#4b5563;
          --font:"Plus Jakarta Sans","Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.4 var(--font); }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:16px; padding:28px 24px;
          text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 6px; }
  .status { color:var(--muted); margin:0 0 22px; min-height:1.4em; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--off); margin-right:8px; }
  .dot.on { background:#22c55e; }
  button, a.btn { font-family:inherit; display:block; width:100%; padding:14px; border:0; border-radius:12px; font-size:17px;
          font-weight:600; background:var(--accent); color:#fff; text-decoration:none; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); margin-top:10px; font-weight:500; }
  button:disabled { background:var(--off); cursor:not-allowed; }
</style>
</head>
<body>
<div class="card">
  <h1>English Study Site</h1>
  <p class="status"><span class="dot" id="dot"></span><span id="msg">확인 중...</span></p>
  <a class="btn" id="open" href="#" style="display:none">사이트 열기</a>
  <button id="off" disabled style="display:none">사이트가 오프라인입니다</button>
  <button class="secondary" id="refresh">다시 확인</button>
</div>
<script>
  // Filled in by setup-launcher.ps1
  const GIST_ID = "0c01da03be89b9969888ea765fde21cd";

  const $ = id => document.getElementById(id);
  async function check() {
    $("msg").textContent = "확인 중...";
    $("dot").className = "dot";
    $("open").style.display = "none";
    $("off").style.display = "none";
    try {
      // Raw URL has no strict API rate limit (the API allows only 60 requests/hour)
      const r = await fetch("https://gist.githubusercontent.com/dsbro123/" + GIST_ID + "/raw/link.txt?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const text = (await r.text()).trim();
      if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(text)) {
        $("dot").className = "dot on";
        $("msg").textContent = "사이트가 켜져 있습니다";
        $("open").href = text + "/dashboard";
        $("open").style.display = "block";
      } else {
        $("msg").textContent = "사이트가 오프라인입니다";
        $("off").style.display = "block";
      }
    } catch (e) {
      $("msg").textContent = "확인할 수 없습니다. 다시 시도해 주세요.";
      $("off").style.display = "block";
    }
  }
  $("refresh").addEventListener("click", check);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  check();
</script>
</body>
</html>
